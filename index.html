<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer & Sanskrit Font Selector</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">វចនានុក្រមខ្មែរបុរាណ</div>
        
        <!-- ប៊ូតុង Toggle សម្រាប់អេក្រង់តូច -->
        <button class="nav-toggle" id="navToggle" aria-label="toggle navigation">
            <span class="hamburger"></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="#">ទំព័រដើម</a></li>
            <li><a href="#">អំពីខ្ញុំ</a></li>
            <li><a href="#">ទំនាក់ទំនង</a></li>
        </ul>
    </nav>
	
    <div class="container">
        <div class="font-selectors">
            <div class="font-option active" onclick="changeFont(this, 'khmer-font1')">ខ្មែរទំនើប</div>
            <div class="font-option" onclick="changeFont(this, 'khmer-font2')">មុនអង្គរ</div>
            <div class="font-option" onclick="changeFont(this, 'khmer-font3')">អង្គរ១</div>
            <div class="font-option" onclick="changeFont(this, 'khmer-font4')">អង្គរ៣</div>
            <div class="font-option" onclick="changeFont(this, 'khmer-font5')">អង្គរ៥</div>
        </div>
        
        <input type="text" id="searchInput" class="search-box" placeholder="ស្វែងរក / Search..." onkeyup="filterList()">
        
        <div class="list-container">
            <div class="list-box" id="listBox"></div>
            <div id="descriptionBox" class="description-box">
                <p style="color: #666;">សូមជ្រើសរើសធាតុណាមួយ / Please select an item</p>
            </div>
        </div>
    </div>

    <center>
        <div class="button-group">
            <a href="keyboard.html" class="btn btn-primary">ក្ដារចុចខ្មែរបុរាណ</a>
            <a href="#secondary" class="btn btn-secondary">Secondary Action</a>
            <a href="#outline" class="btn btn-outline">Outlined Link</a>
        </div>
    </center>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 រក្សាសិទ្ធិគ្រប់យ៉ាងដោយវចនានុក្រមខ្មែរបុរាណ</p>
    </footer>

    <!-- ភ្ជាប់ទៅកាន់ឯកសារ JavaScript ខាងក្រៅ -->
    <script src="script.js"></script>
</body>
</html>
